<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação 07 - Laços e estruturas de desvios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Usuários</h1>

        <div class="main-content">
            <div class="left-column">
                <div class="form-section card">
                    <h2>Cadastrar Usuário</h2>
                    <form id="userForm">
                        <div class="form-group">
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" required>
                        </div>
                        <div class="form-group">
                            <label for="endereco">Endereço:</label>
                            <input type="text" id="endereco" required>
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone:</label>
                            <input type="text" id="telefone" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" required>
                        </div>
                        <button type="submit">Cadastrar Usuário</button>
                    </form>
                    <p id="individualMessage" class="message"></p>
                </div>
            </div>

            <div class="right-column">
                <div class="user-count-card card">
                    <h2>Total de Usuários Cadastrados</h2>
                    <p class="user-count-display" id="userCount">0</p>
                    <button id="refreshUserCount">Atualizar Contagem</button>
                </div>

                <div class="batch-section card">
                    <h2>Cadastrar 1000 Usuários</h2>
                    <p>Este processo pode demorar. Por favor, aguarde.</p>
                    <button id="batchCreateUsers">Cadastrar 1000 Usuários</button>
                    <p id="batchMessage" class="message"></p>
                    <p>Progresso: <span id="progress">0</span> / 1000</p>
                </div>
            </div>
        </div>  
    </div>

    <script src="script.js"></script>
</body>
</html>
